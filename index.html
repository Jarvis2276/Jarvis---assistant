HTML

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050d18">
<title>JARVIS AI 1.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle, #102c42, #030811 75%);
    color: #00d9ff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.app {
    width: 100%;
    max-width: 650px;
    padding: 25px;
    border: 1px solid #00d9ff;
    border-radius: 22px;
    background: rgba(4, 18, 32, 0.95);
    box-shadow: 0 0 35px #007b9c;
    text-align: center;
}

h1 {
    font-size: 38px;
    letter-spacing: 7px;
    margin-bottom: 5px;
}

.subtitle {
    color: #7b9eaf;
    font-size: 12px;
    letter-spacing: 3px;
}

.reactor {
    width: 190px;
    height: 190px;
    margin: 35px auto;
    border: 3px solid #00d9ff;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
    text-shadow: 0 0 20px #00d9ff;
    box-shadow: 0 0 20px #00d9ff,
                inset 0 0 25px #007b9c;
    animation: pulse 3s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 40px #00d9ff,
                    inset 0 0 40px #007b9c;
    }
}

.info {
    color: #8caebd;
    margin: 12px;
}

.status {
    color: #00ffae;
    margin: 20px;
    font-weight: bold;
}

button {
    background: #00bde8;
    color: #00111d;
    border: none;
    border-radius: 9px;
    padding: 13px 18px;
    margin: 5px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #80edff;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    background: #10283b;
    color: white;
    border: 1px solid #00d9ff;
    border-radius: 9px;
    font-size: 16px;
}

.output {
    margin-top: 20px;
    padding: 18px;
    min-height: 75px;
    background: #10283b;
    border-radius: 10px;
    color: white;
    text-align: left;
    line-height: 1.5;
}

.footer {
    color: #57798c;
    font-size: 11px;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="app">

<h1>J.A.R.V.I.S.</h1>
<div class="subtitle">PERSONAL ARTIFICIAL INTELLIGENCE</div>

<div class="reactor">J</div>

<div class="info" id="clock"></div>
<div class="status" id="status">
SYSTEM ONLINE – JARVIS BEREIT
</div>

<button onclick="startListening()">🎤 SPRACHSTEUERUNG</button>

<button onclick="greet()">🔊 BEGRÜSSUNG</button>

<input
id="command"
type="text"
placeholder="Befehl an JARVIS..."
onkeydown="if(event.key==='Enter') processCommand()">

<button onclick="processCommand()">AUSFÜHREN</button>

<div class="output" id="output">
Guten Abend. Ich bin JARVIS.
Alle Systeme sind bereit.
</div>

<div class="footer">
JARVIS AI SYSTEM · VERSION 1.0 · 2026
</div>

</div>

<script>

const output = document.getElementById("output");
const status = document.getElementById("status");

function updateClock() {
    const now = new Date();

    document.getElementById("clock").innerText =
        now.toLocaleDateString("de-DE") + " | " +
        now.toLocaleTimeString("de-DE");
}

updateClock();
setInterval(updateClock, 1000);

function speak(text) {
    if (!("speechSynthesis" in window)) {
        output.innerText = text;
        return;
    }

    speechSynthesis.cancel();

    const message = new SpeechSynthesisUtterance(text);
    message.lang = "de-DE";
    message.rate = 0.95;
    message.pitch = 0.9;

    speechSynthesis.speak(message);
}

function greet() {
    const text =
        "Guten Abend. JARVIS ist online. " +
        "Wie kann ich dich unterstützen?";

    output.innerText = text;
    speak(text);
}

function startListening() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        output.innerText =
            "Dein Browser unterstützt diese Spracherkennung nicht.";
        return;
    }

    const recognition = new Recognition();

    recognition.lang = "de-DE";
    recognition.interimResults = false;

    status.innerText = "JARVIS HÖRT ZU...";

    recognition.onresult = function(event) {
        document.getElementById("command").value =
            event.results[0][0].transcript;

        processCommand();
    };

    recognition.onerror = function() {
        status.innerText = "SPRACHEINGABE NICHT VERFÜGBAR";
    };

    recognition.onend = function() {
        status.innerText = "SYSTEM ONLINE – JARVIS BEREIT";
    };

    recognition.start();
}

function processCommand() {

    const command = document
        .getElementById("command")
        .value.toLowerCase()
        .trim();

    if (!command) return;

    let answer;

    if (command.includes("hallo") ||
        command.includes("guten morgen")) {

        answer = "Guten Tag. JARVIS ist einsatzbereit.";

    } else if (command.includes("wer bist du") ||
               command.includes("wie heißt du")) {

        answer = "Ich bin JARVIS, dein persönlicher digitaler Assistent.";

    } else if (command.includes("uhrzeit")) {

        answer = "Die aktuelle Uhrzeit ist " +
            new Date().toLocaleTimeString("de-DE");

    } else if (command.includes("datum")) {

        answer = "Heute ist der " +
            new Date().toLocaleDateString("de-DE");

    } else if (command.includes("hand in hand")) {

        answer = "Hand in Hand Haus und Alltagshilfe ist unser Hauptprojekt. Ich unterstütze dich bei Strategie, Finanzen, Organisation und Unternehmensaufbau.";

    } else if (command.includes("systemstatus")) {

        answer = "Alle Grundfunktionen von JARVIS sind betriebsbereit.";

    } else if (command.includes("hilfe")) {

        answer = "Ich kann Datum, Uhrzeit, Begrüßung und Informationen zu Hand in Hand bereitstellen.";

    } else if (command.includes("danke")) {

        answer = "Gern geschehen. JARVIS steht bereit.";

    } else {

        answer = "Befehl erkannt, aber noch nicht in meiner Grundversion hinterlegt. Eine KI-Anbindung wird in der nächsten Entwicklungsstufe ergänzt.";
    }

    output.innerText = answer;
    speak(answer);

    document.getElementById("command").value = "";
}

</script>

</body>
</html>
